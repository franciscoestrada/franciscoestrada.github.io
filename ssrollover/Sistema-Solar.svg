		<text transform="matrix(1 0 0 1 123.7407 458.8433)"><tspan x="0" y="0" class="st8 st5 st9">Diosa y Madre Tierra.</tspan><tspan x="0" y="12" class="st8 st5 st9">Creadora del Universo, </tspan><tspan x="0" y="24" class="st8 st5 st9">los titanes y humanos. </tspan><tspan x="0" y="36" class="st8 st5 st9">En la mitología griega, </tspan><tspan x="0" y="48" class="st8 st5 st9">representa a la tierra.</tspan></text>
