		<text transform="matrix(1 0 0 1 143 442)" class="st4 st5 st6">MERCURIO</text>
		<rect x="124.74" y="451.74" class="st7" width="102.5" height="57.6"/>
		<text transform="matrix(1 0 0 1 124.7407 458.8433)" class="st3"><tspan x="0" y="0" class="st8 st5 st9">Dios del comercio, hijo </tspan><tspan x="0" y="12" class="st8 st5 st9">de Júpiter y Maia </tspan><tspan x="0" y="24" class="st8 st5 st9">Maiestas, fertilidad.</tspan><tspan x="0" y="36" class="st8 st5 st9"> En la mitología griega, </tspan><tspan x="0" y="48" class="st8 st5 st9">representa a Hermes.</tspan></text>
	</g>
